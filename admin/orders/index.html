<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="0;url=../?view=orders">
  <title>Abriendo pedidos · Go Store</title>
</head>
<body>
  <p>Abriendo los pedidos de tu tienda… <a href="../?view=orders">Continuar al panel</a></p>
  <script>
    const destination = new URL("../", location.href);
    const params = new URLSearchParams(location.search);
    params.set("view", "orders");
    destination.search = params.toString();
    location.replace(destination);
  </script>
</body>
</html>
