<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f6f0">
  <title>Pedidos · Go Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar"><a href="../../creator/" class="brand"><span class="brand-mark">g</span><span><strong>Go Store</strong><small>GESTIÓN DE PEDIDOS</small></span></a><div class="topbar-actions"><a class="text-link" href="../../creator/">Volver al creador</a><button id="signOutButton" class="text-button hidden" type="button">Cerrar sesión</button></div></header>
  <main class="shell">
    <section id="authScreen" class="auth-card">
      <p class="eyebrow">TU NEGOCIO</p><h1>Ingresá para ver tus pedidos</h1><p>Usá el correo asociado a tu tienda. Te enviaremos un enlace de acceso.</p>
      <form id="loginForm"><label for="loginEmail">Correo electrónico</label><input id="loginEmail" type="email" required autocomplete="email" placeholder="nombre@correo.com"><button class="primary-button" type="submit">Enviar enlace de acceso <span>→</span></button></form>
      <p id="authMessage" class="message" role="status"></p>
    </section>
    <section id="ordersPanel" class="hidden">
      <div class="page-heading"><div><p class="eyebrow">TU ESPACIO DE TRABAJO</p><h1>Pedidos</h1><p id="storeLabel" class="muted"></p></div><button id="refreshButton" class="secondary-button" type="button">Actualizar ↻</button></div>
      <p id="ordersMessage" class="message" role="status"></p>
      <div id="ordersList" class="orders-list"></div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../../creator/supabase-config.js"></script>
  <script src="app.js"></script>
</body>
</html>
